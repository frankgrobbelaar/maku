# Publishes the downloads page (https://frankgrobbelaar.github.io/maku/): every released version,
# newest first, with its notes and installer, built by scripts/downloads-page.mjs from the
# GitHub releases. The release workflow starts it after each release; it also runs when the page's
# code changes, and by hand (Actions › Downloads page › Run workflow, say after editing a release's
# notes on GitHub). See docs/releasing.md.
name: Downloads page

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/downloads-page.mjs
      - scripts/versioning.mjs
      - .github/workflows/downloads.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
      - name: Build the page from the releases
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/downloads-page.mjs site
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
