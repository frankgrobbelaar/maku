[package]
name = "maku"
version = "0.0.0" # Maku's version lives in app/package.json (see docs/releasing.md)
description = "Maku's desktop shell: the window, the engine process and updates."
edition = "2024"
license = "MIT"
publish = false

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
getrandom = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.4", features = ["tray-icon"] }
tauri-plugin-autostart = "2.7.0"
tauri-plugin-dialog = "2.8.3"
tauri-plugin-notification = "2.7.0"
tauri-plugin-opener = "2.7.2"
tauri-plugin-single-instance = "2.5.4"
tauri-plugin-updater = "2.14.0"

[profile.release]
codegen-units = 1
lto = true
strip = true
